[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miai"
version = "1.0.0"
description = "Enterprise Golden Standard AI Foundation and Multi-Engine Platform"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Microtec AI Architecture Team", email = "dev@microtec.vn"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "redis[hiredis]>=5.0.3",
    "numpy>=1.26.4",
    "tiktoken>=0.6.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.7",
    "sqlparse>=0.4.4",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "sentence-transformers>=2.5.1",
    "faster-whisper>=1.0.1",
    "opencv-python-headless>=4.9.0",
    "paddleocr>=2.7.3",
]
dev = [
    "black>=24.2.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "engines*", "api*", "schemas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.pyright]
include = [".", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
