version: '3.8'

services:
  base-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miai-app
    restart: unless-stopped
    ports:
      - "${APP_PORT_HOST:-127.0.0.1:8006}:8000"
    environment:
      - APP_ENV=production
      - APP_NAME=miai
      - DEFAULT_LLM_PROVIDER=VLLM
      - VLLM_BASE_URL=http://vllm-engine:8000/v1
      - VLLM_DEFAULT_MODEL=Qwen/Qwen2.5-7B-Instruct-AWQ
      - EMBEDDING_PROVIDER=LOCAL_CPU
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=miai_db
      - POSTGRES_USER=micro
      - POSTGRES_PASSWORD=Micro@31122020
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis-cache
    networks:
      - ai-network
      - databases_default

  vllm-engine:
    image: vllm/vllm-openai:latest
    container_name: miai-vllm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${VLLM_PORT_HOST:-127.0.0.1:8002}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - /data/uc2-ai/huggingface_cache:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq
      --gpu-memory-utilization 0.85
      --max-model-len 8192
      --max-num-seqs 16
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --port 8000
    networks:
      - ai-network

  redis-cache:
    image: redis:7-alpine
    container_name: miai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-network

volumes:
  redis_data:
  huggingface_cache:

networks:
  ai-network:
    driver: bridge
  databases_default:
    external: true
